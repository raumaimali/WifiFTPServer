name: Build APK on: push: branches: [ main ] workflow_dispatch: # دستی چلانے کے لیے jobs: build: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-java@v4 with: java-version: '17' - run: chmod +x gradlew - run: ./gradlew assembleDebug - uses: actions/upload-artifact@v4 with: name: Personal-FTP-Server-APK path: app/build/outputs/apk/debug/*.apk
